# Local development infrastructure for the combined TIXIFY workspace.
#
# The workspace has two PostgreSQL schemas that must not collide: the booking
# app owns users/events/inventory/bookings/tickets, and the security engine owns
# its own telemetry, audit, idempotency and scan tables. Rather than run two
# Postgres containers, both live in this one server as separate databases:
#
#   tixify_app   booking app   (drizzle-kit, DATABASE_URL)
#   tixify       security engine (engine migrations)
#
# The engine's tests additionally need Redis, which is the same instance the app
# uses for rate limiting, idempotency and the virtual queue.
#
#   pnpm run infra:up     start
#   pnpm run infra:wait   block until both accept connections
#   pnpm run infra:down   stop and delete volumes
#
# Not for production. Use a managed Redis and a pooled Postgres connection
# string when deploying.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tixify-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tixify
      # Deterministic collation so index behaviour matches CI.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - tixify-pgdata:/var/lib/postgresql/data
      # Creates the booking app database alongside the security engine one.
      - ./scripts/docker/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tixify"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  redis:
    image: redis:7-alpine
    container_name: tixify-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # Rate limit counters and queue positions are correctness-bearing, not
      # cache entries. Evicting them would silently drop in-flight limits.
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

volumes:
  tixify-pgdata:
    name: tixify-pgdata
